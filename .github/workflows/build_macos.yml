name: Build macOS App and DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (taglib)
        run: brew install taglib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller (using spec file)
        run: |
          pyinstaller --windowed --name "MusicTagEditor" tag.spec

      # ===== 新增：创建 DMG =====
      - name: Create DMG package
        run: |
          # 创建临时文件夹并放入 .app
          mkdir -p dmg_staging
          cp -R dist/MusicTagEditor.app dmg_staging/
          # 使用 hdiutil 生成压缩的 DMG（UDZO 格式）
          hdiutil create -volname "MusicTagEditor" \
                         -srcfolder dmg_staging \
                         -ov -format UDZO \
                         MusicTagEditor.dmg

      - name: Archive build artifacts（.app 和 .dmg）
        uses: actions/upload-artifact@v3
        with:
          name: MusicTagEditor-macOS
          path: |
            dist/MusicTagEditor.app
            MusicTagEditor.dmg
