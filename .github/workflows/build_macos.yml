name: Build macOS App and DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (taglib)
        run: brew install taglib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller (use spec file)
        run: |
          pyinstaller tag.spec   # 这里不再加额外参数

      - name: Create DMG package
        run: |
          mkdir -p dmg_staging
          cp -R dist/MusicTagEditor.app dmg_staging/
          hdiutil create -volname "MusicTagEditor" \
                         -srcfolder dmg_staging \
                         -ov -format UDZO \
                         MusicTagEditor.dmg

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicTagEditor-macOS
          path: |
            MusicTagEditor.dmg
