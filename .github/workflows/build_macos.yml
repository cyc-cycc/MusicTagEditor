name: Build macOS App and DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (taglib)
        run: brew install taglib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller (using spec file)
        run: |
          pyinstaller --windowed --name "MusicTagEditor" tag.spec

      - name: Create DMG package
        run: |
          mkdir -p dmg_staging
          cp -R dist/MusicTagEditor.app dmg_staging/
          hdiutil create -volname "MusicTagEditor" \
                         -srcfolder dmg_staging \
                         -ov -format UDZO \
                         MusicTagEditor.dmg

      # ===== 主要修改点：将 actions/upload-artifact 从 v3 升级到 v4 =====
      - name: Archive build artifacts（.app 和 .dmg）
        uses: actions/upload-artifact@v4
        with:
          name: MusicTagEditor-macOS
          path: |
            MusicTagEditor.dmg
